apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: book-review-pipeline-run
spec:
  pipelineRef:
    name: book-review-pipeline
  params:
    - name: repo-url
      value: "https://github.com/Allin152/expressBookReviews"
    - name: branch
      value: "main"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
